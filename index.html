<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; }
        h1 { margin-bottom: 10px; color: #55ff55; }
        p { color: #aaaaaa; margin-bottom: 20px; }
        
        .store-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 20px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .card h3 { font-size: 22px; color: #fff; margin-bottom: 10px; }
        .card .price { font-size: 18px; color: #ffaa00; font-weight: bold; margin-bottom: 15px; }
        
        .qr-img { width: 180px; height: 180px; border-radius: 8px; margin-bottom: 15px; border: 2px solid #333; }
        .upi-id { background: #2a2a2a; padding: 8px; border-radius: 5px; font-size: 14px; font-weight: bold; color: #55ffff; margin-bottom: 15px; display: inline-block; word-break: break-all; }
        
        form { display: flex; flex-direction: column; gap: 10px; }
        input { padding: 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 5px; color: #fff; outline: none; }
        input:focus { border-color: #55ff55; }
        
        button { padding: 12px; background: #55ff55; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #33cc33; }
        
        #status-msg { margin-top: 15px; font-size: 14px; font-weight: bold; color: #ffaa00; }
    </style>
</head>
<body>

    <h1>Server Webstore</h1>
    <p>Pay via UPI QR and enter your details below for immediate processing.</p>

    <div class="store-container">
        <div class="card">
            <h3>VIP Rank</h3>
            <p class="price">₹100</p>
            
            <!-- Replace 'your-upi-qr.png' with your QR image file name or link -->
            <img src="your-upi-qr.png" alt="UPI QR Code" class="qr-img">
            
            <div class="upi-id">UPI: yourname@upi</div>

            <form id="payForm">
                <input type="text" id="username" placeholder="Minecraft Username" required>
                <input type="text" id="utr" placeholder="12-Digit UTR Number" pattern="[0-9]{12}" maxlength="12" title="Must be exactly 12 digits" required>
                <button type="submit" id="submitBtn">Submit Payment</button>
            </form>

            <p id="status-msg"></p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7TUSTxFgYqAGKLz3KT2gyxY7_MRvbpsMqrSB5_joxbd-eVsm85exnfN8TuOGrdsLZfg/exec";

        document.getElementById('payForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('status-msg');
            const username = document.getElementById('username').value.trim();
            const utr = document.getElementById('utr').value.trim();

            btn.disabled = true;
            btn.innerText = "Submitting...";
            msg.innerText = "Logging order...";

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "NEW_ORDER",
                    username: username,
                    utr: utr,
                    item: "VIP Rank"
                })
            })
            .then(res => res.text())
            .then(data => {
                msg.style.color = "#55ff55";
                msg.innerText = "Order submitted! Your payment will be verified once your bank SMS is received.";
                document.getElementById('payForm').reset();
            })
            .catch(error => {
                msg.style.color = "#ff5555";
                msg.innerText = "Error submitting order. Please try again.";
                console.error("Error:", error);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Submit Payment";
            });
        });
    </script>
</body>
</html>
