<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXI Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-shell">
        <header class="top-bar">
            <div class="time">6:16</div>
            <div class="status-icons" aria-label="status icons">
                <span class="signal signal-1"></span>
                <span class="signal signal-2"></span>
                <span class="signal signal-3"></span>
                <span class="wifi"></span>
                <span class="battery"><span class="battery-level"></span></span>
            </div>
        </header>

        <div class="browser-bar">
            <button class="icon home-btn" type="button" aria-label="home">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 3.5 10.5V20h6.5v-6h4v6h6.5v-9.5L12 3.5Z"/></svg>
            </button>
            <div class="address-bar">jaex4u.github.io/OXI-STOF</div>
            <button class="icon add-btn" type="button" aria-label="add">+</button>
            <div class="counter">43</div>
            <button class="icon menu-btn" type="button" aria-label="menu">
                <span></span><span></span><span></span>
            </button>
        </div>

        <main class="content-panel">
            <section class="info-card discord-card">
                <div class="discord-logo" aria-hidden="true">
                    <svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg">
                        <path d="M74 111c-18 0-34 14-34 32v39c0 17 14 31 32 31h31l8 46 42-46h152c18 0 32-14 32-31v-39c0-18-14-32-32-32H74Zm45 62c-16 0-28-13-28-28s12-28 28-28 28 13 28 28-12 28-28 28Zm156 0c-16 0-28-13-28-28s12-28 28-28 28 13 28 28-12 28-28 28Z" fill="white"/>
                        <circle cx="119" cy="145" r="22" fill="#5a5af3"/>
                        <circle cx="301" cy="145" r="22" fill="#5a5af3"/>
                        <path d="M155 188c19 16 47 23 96 23 49 0 77-7 96-23" fill="none" stroke="#5a5af3" stroke-width="12" stroke-linecap="round"/>
                    </svg>
                </div>
                <a href="https://discord.gg/EpnjfuHgjT" target="_blank" rel="noreferrer" class="card-link discord-link">Join<br>Discord</a>
            </section>

            <section class="info-card email-card">
                <div class="mail-icon" aria-hidden="true">
                    <svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg">
                        <path d="M54 92c0-20 16-36 36-36h240c20 0 36 16 36 36v116c0 20-16 36-36 36H90c-20 0-36-16-36-36V92Z" fill="white"/>
                        <path d="M76 110l124 88 124-88" fill="none" stroke="#4b5667" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <a href="mailto:dioxsupport@gmail.com" class="card-link email-link">dioxsupport@gmail.com</a>
            </section>

            <section class="ip-card">
                <button type="button" class="ip-button" data-copy="dioxide.pixelforge.gg">dioxide.pixelforge.gg</button>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="bottom navigation">
            <button type="button" class="nav-button nav-hamburger" aria-label="menu">
                <span></span><span></span><span></span>
            </button>
            <button type="button" class="nav-button nav-dot" aria-label="status"></button>
            <button type="button" class="nav-button nav-back" aria-label="back">&lt;</button>
        </nav>
    </div>

    <div class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
