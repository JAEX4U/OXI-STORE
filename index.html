<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="store-card">
    <h2>Server Store</h2>
    <p>Scan QR to pay via UPI</p>
    
    <!-- Updated with your hosted ImgBB QR code image -->
    <img src="https://i.ibb.co/G3dzfN90/1000101649.jpg" alt="UPI QR Code" class="qr-image">
    
    <form id="payForm">
        <select id="item" required>
            <option value="VIP Rank">VIP Rank - ₹100</option>
            <option value="MVP Rank">MVP Rank - ₹250</option>
            <option value="5x Crate Keys">5x Crate Keys - ₹50</option>
        </select>
        
        <input type="text" id="username" placeholder="Minecraft Username" required>
        <input type="text" id="utr" placeholder="12-digit UTR Number" pattern="[0-9]{12}" title="Must be a 12-digit numeric UTR" required>
        
        <button type="submit" id="submitBtn">Submit Payment Log</button>
    </form>

    <p id="msg"></p>
</div>

<script src="script.js"></script>
</body>
</html>
